services:

  init-img-data:
    image: alpine:latest
    container_name: init_img_data
    volumes:
      - img-data:/var/www/html/img
    command: chown -R 82:82 /var/www/html/img
    networks:
      - app-network

  backend:
    image: nizarabdo/ecommerce-backend:v1.0.0
    container_name: backend_api
    restart: unless-stopped
    depends_on:
      init-img-data:
        condition: service_completed_successfully
    networks:
      - app-network
    volumes:
      - img-data:/var/www/html/img
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    container_name: proxy_client
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - app-network
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client:/usr/share/nginx/html:ro
      - img-data:/var/www/img:ro
    depends_on:
      - backend

  database:
    image: mariadb:10.4
    container_name: database_mysql
    restart: unless-stopped
    networks:
      - app-network
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
    volumes:
      - db-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro


networks:
  app-network:
    driver: bridge


volumes:
  db-data:
    name: project_db_data

  img-data:
    name: project_img_data