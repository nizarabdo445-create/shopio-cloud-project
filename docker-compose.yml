services:

  init-img-data:
    image: alpine:latest
    container_name: init_img_data
    volumes:
      - img-data:/var/www/html/img
      - ./img:/seed-img:ro
    command: >
      sh -c "
        cp -n /seed-img/* /var/www/html/img/ 2>/dev/null || true;
        chown -R 82:82 /var/www/html/img
      "
    networks:
      - app-network

  backend:
    image: nizarabdo/ecommerce-backend:v1.0.0
    container_name: backend_api
    restart: unless-stopped
    depends_on:
      init-img-data:
        condition: service_completed_successfully
      database:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - img-data:/var/www/html/img
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: proxy_client
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - app-network
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client:/usr/share/nginx/html:ro
      - img-data:/var/www/img:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1/login.html || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  database:
    image: mariadb:10.4
    container_name: database_mysql
    restart: unless-stopped
    networks:
      - app-network
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  img-data:
