<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Nizar Store</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: var(--background-color, #F8FAFC);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-logo {
            font-size: 3rem;
            color: var(--primary-color, #2563EB);
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 2rem;
            display: inline-block;
        }
        /* Custom alert for generic messages */
        #registerAlert {
            display: none;
        }
    </style>
</head>
<body>
    
<div class="container py-5">
    <div class="modern-form-container text-center">
        <!-- Logo Area Placeholder -->
        <div class="login-logo">Nizar</div>
        
        <h3 class="fw-bold mb-4 text-dark">Create an Account</h3>
        
        <div id="registerAlert" class="alert" role="alert"></div>

        <form id="registerForm" class="text-start">
            
            <!-- Username Input -->
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="usernameInput" name="un" placeholder="Username" required>
                <label for="usernameInput"><i class="bi bi-person me-2 text-muted"></i>Username</label>
                <div class="invalid-feedback fw-medium" id="usernameFeedback"></div>
            </div>

            <!-- Email Input -->
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="emailInput" name="email" placeholder="name@example.com" required>
                <label for="emailInput"><i class="bi bi-envelope me-2 text-muted"></i>Email address</label>
                <div class="invalid-feedback fw-medium" id="emailFeedback"></div>
            </div>
            
            <!-- Password Input -->
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="passwordInput" name="password" placeholder="Password" required>
                <label for="passwordInput"><i class="bi bi-lock me-2 text-muted"></i>Password</label>
                <div class="invalid-feedback fw-medium" id="passwordFeedback"></div>
            </div>

            <!-- Confirm Password Input -->
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="conpassInput" name="conpass" placeholder="Confirm Password" required>
                <label for="conpassInput"><i class="bi bi-shield-lock me-2 text-muted"></i>Confirm Password</label>
                <div class="invalid-feedback fw-medium" id="conpassFeedback"></div>
            </div>
            
            <!-- Submit Button -->
            <button class="btn btn-primary-custom w-100 py-2 fs-5 mb-3" type="submit" id="registerBtn">
                <span class="spinner-border spinner-border-sm d-none me-2" id="registerSpinner" role="status" aria-hidden="true"></span>
                Sign Up
            </button>
            
            <!-- Login Link -->
            <div class="text-center mt-4">
                <p class="text-muted mb-0">Already have an account? <a href="login.html" class="text-primary-custom fw-semibold text-decoration-none">Sign In</a></p>
            </div>
        </form>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS for API integration -->
<script src="register.js"></script>
</body>
</html>
