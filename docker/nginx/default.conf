server {
    listen 80;
    server_name localhost;

    # Root for the frontend client files
    root /usr/share/nginx/html;
    index index.html index.php;

    # Serve static assets and images
    location /img/ {
        alias /var/www/img/;
        try_files $uri $uri/ =404;
    }

    # Route frontend files
    location / {
        try_files $uri $uri/ =404;
    }

    # Route API requests to PHP-FPM Backend
    location /api/ {
        # The backend container's API is in /var/www/html/api
        # Nginx forwards the request to the fastcgi server
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        
        # We point SCRIPT_FILENAME to the front controller index.php inside the backend container
        fastcgi_param SCRIPT_FILENAME /var/www/html/api/index.php;
        
        include fastcgi_params;

        # Important: pass the original request URI to PHP
        fastcgi_param REQUEST_URI $request_uri;
    }
}
